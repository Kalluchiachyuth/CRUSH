[project]
name = "crush"
version = "0.1.0"
description = ""
authors = [
    {name = "BenNolann",email = "bennolan12@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hic-straw (>=1.3.1,<2.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)"
]

[tool.poetry]
packages = [{include = "crush", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
